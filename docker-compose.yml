# Local Postgres for gator: `make db-up`, then `make migrate-up`.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gator
    ports:
      # Override if 5432 is taken, e.g. by a system Postgres:
      #   GATOR_DB_PORT=5433 make db-up
      - "${GATOR_DB_PORT:-5432}:5432"
    volumes:
      - gator-db:/var/lib/postgresql/data
    healthcheck:
      # Lets `docker compose up --wait` block until Postgres accepts connections.
      test: ["CMD-SHELL", "pg_isready -U postgres -d gator"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  gator-db:
