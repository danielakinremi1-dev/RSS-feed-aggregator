# Builds release binaries when a v* tag is pushed (.github/workflows/release.yml).
# Try it locally: goreleaser release --snapshot --clean
version: 2

project_name: gator

before:
  hooks:
    - go mod tidy

builds:
  - id: gator
    main: ./cmd/gator
    binary: gator
    env:
      - CGO_ENABLED=0 # static binaries; gator is pure Go
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/danielakinremi1-dev/RSS_feed_aggregator/internal/cli.Version={{ .Version }}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs"
      - "^Test"
