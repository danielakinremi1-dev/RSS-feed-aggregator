version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose # HTTP response bodies must be closed
    - errorlint # use errors.Is/As and %w with wrapped errors
    - misspell
  exclusions:
    presets:
      - std-error-handling # e.g. unchecked Close() and fmt.Fprint* errors

formatters:
  enable:
    - gofmt
